# CifraTrack — produção
#
# Portas HOST (evitam conflito com VPS ocupada):
#   Frontend (Nginx)  → 8088
#   Backend  (API)    → 3200
#   PostgreSQL 16     → 5434
#   MinIO S3 API      → 9002
#   MinIO Console     → 9003
#   Redis             → (só rede interna)
#   Audio worker      → (só rede interna :8001)
#
# Em uso na VPS (NÃO usar no host): 3000-3002, 3100-3102, 3306-3307, 5432-5433, 8001, 8081

name: cifratrack

services:
  db:
    image: postgres:16-alpine
    container_name: cifratrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cifratrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cifratrack}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - cifratrack_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - cifratrack_net

  redis:
    image: redis:7-alpine
    container_name: cifratrack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cifratrack_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cifratrack_net

  minio:
    image: minio/minio:latest
    container_name: cifratrack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-cifratrack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-cifratrack_secret}
      # Community MinIO: CORS cluster-wide
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MINIO_API_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - cifratrack_minio_data:/data
    networks:
      - cifratrack_net

  minio-init:
    image: minio/mc:latest
    container_name: cifratrack-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-cifratrack} $${MINIO_ROOT_PASSWORD:-cifratrack_secret};
      mc mb --ignore-existing local/$${S3_BUCKET:-cifratrack};
      echo 'MinIO bucket ready';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-cifratrack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-cifratrack_secret}
      S3_BUCKET: ${S3_BUCKET:-cifratrack}
    networks:
      - cifratrack_net

  audio-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: cifratrack-audio-worker
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cifratrack-internal}
    # Sem porta no host (8001 já pode estar ocupada na VPS) — só rede Docker
    networks:
      - cifratrack_net

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: cifratrack-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      audio-worker:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cifratrack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cifratrack}?schema=public
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:8088}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      REQUIRE_APPROVAL: ${REQUIRE_APPROVAL:-true}
      BETA_MODE: ${BETA_MODE:-false}
      BETA_INVITE_CODES: ${BETA_INVITE_CODES:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@cifratrack.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      RUN_SEED: ${RUN_SEED:-false}
      ENSURE_ADMIN: ${ENSURE_ADMIN:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Browser/player: host público do MinIO (porta 9002 no host)
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9002}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cifratrack}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cifratrack_secret}
      S3_BUCKET: ${S3_BUCKET:-cifratrack}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-}
      UPLOAD_MODE: ${UPLOAD_MODE:-proxy}
      # proxy = browser baixa áudio/sync via /v1/storage (same-origin). Nunca use 127.0.0.1.
      STORAGE_BROWSER_MODE: ${STORAGE_BROWSER_MODE:-proxy}
      AUDIO_WORKER_URL: ${AUDIO_WORKER_URL:-http://audio-worker:8001}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000/v1}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cifratrack-internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    ports:
      - "${API_HOST_PORT:-3200}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - cifratrack_net

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/v1}
        VITE_BETA_MODE: ${VITE_BETA_MODE:-false}
    container_name: cifratrack-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    networks:
      - cifratrack_net

volumes:
  cifratrack_pg_data:
  cifratrack_redis_data:
  cifratrack_minio_data:

networks:
  cifratrack_net:
    driver: bridge
