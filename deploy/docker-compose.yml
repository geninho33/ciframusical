# CifraTrack — produção (3 containers)
#
# Portas HOST (evitam conflito com VPS ocupada):
#   Frontend (Nginx)  → 8088
#   Backend  (API)    → 3200
#   PostgreSQL 16     → 5434
#
# Em uso na VPS (NÃO usar): 3000-3002, 3100-3102, 3306-3307, 5432-5433, 8001, 8081

name: cifratrack

services:
  db:
    image: postgres:16-alpine
    container_name: cifratrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cifratrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cifratrack}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - cifratrack_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - cifratrack_net

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: cifratrack-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cifratrack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cifratrack}?schema=public
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:8088}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      REQUIRE_APPROVAL: ${REQUIRE_APPROVAL:-true}
      BETA_MODE: ${BETA_MODE:-false}
      BETA_INVITE_CODES: ${BETA_INVITE_CODES:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@cifratrack.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      RUN_SEED: ${RUN_SEED:-false}
      # Opcionais (jobs/storage — configure se tiver Redis/S3 externos)
      REDIS_URL: ${REDIS_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-cifratrack}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-}
      AUDIO_WORKER_URL: ${AUDIO_WORKER_URL:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000/v1}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    ports:
      - "${API_HOST_PORT:-3200}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - cifratrack_net

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/v1}
        VITE_BETA_MODE: ${VITE_BETA_MODE:-false}
    container_name: cifratrack-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    networks:
      - cifratrack_net

volumes:
  cifratrack_pg_data:

networks:
  cifratrack_net:
    driver: bridge
