[project]
name = "cifratrack-audio-worker"
version = "0.4.0"
description = "CifraTrack audio analysis worker (BPM/key/chords → CifraSyncDocument)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "httpx>=0.28.0",
  "boto3>=1.35.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
analysis = [
  "librosa>=0.10.2",
]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
