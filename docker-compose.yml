services:
  postgres:
    image: postgres:16-alpine
    container_name: cifratrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cifratrack
      POSTGRES_PASSWORD: cifratrack
      POSTGRES_DB: cifratrack
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cifratrack -d cifratrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cifratrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cifratrack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cifratrack
      MINIO_ROOT_PASSWORD: cifratrack_secret
      # Community MinIO: CORS cluster-wide (bucket CORS = AIStor pago).
      # "*" evita falha quando o front usa localhost vs 127.0.0.1.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    container_name: cifratrack-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 cifratrack cifratrack_secret;
      mc mb --ignore-existing local/cifratrack;
      echo 'Bucket cifratrack ready (CORS via MINIO_API_CORS_ALLOW_ORIGIN)';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
